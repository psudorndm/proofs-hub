# Local development database only. Bound to localhost; never use these credentials in production.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: proofs
      POSTGRES_PASSWORD: proofs
      POSTGRES_DB: proofs
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - proofs-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofs -d proofs"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  proofs-pgdata:
