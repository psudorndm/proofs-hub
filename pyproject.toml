[project]
name = "proof-index"
version = "0.1.0"
description = "Pipeline for the Cryptographic Proofs Research Index"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary — license not yet chosen" }
dependencies = [
    "alembic>=1.13,<2",
    "boto3>=1.35,<2",
    "httpx>=0.27,<0.29",
    "lxml>=5.2,<7",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "pyyaml>=6.0,<7",
    "sqlalchemy>=2.0.30,<2.1",
    "typer>=0.12,<1",
]

[project.scripts]
proof-index = "proof_index.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/src/proof_index"]

[tool.uv]
default-groups = ["dev"]
# Only resolve releases at least two weeks old at lock time (supply-chain caution).
exclude-newer = "2026-10-20T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requires a disposable PostgreSQL database (TEST_DATABASE_URL)",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["pipeline/src", "tests"]
extend-include = ["db/migrations/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ"]
"db/migrations/**" = ["E501", "S608"]

[tool.mypy]
python_version = "3.12"
mypy_path = "pipeline/src"
packages = ["proof_index"]
strict = true
plugins = ["pydantic.mypy"]
