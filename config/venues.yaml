# Venue registry (spec section 9). `key` is the DBLP key prefix (e.g. conf/crypto).
#
# cryptographic: true  -> venue evidence counts as cryptographic context when an
#                         abstract is missing (classification may then return review).
# candidate: true      -> DBLP records from this venue are kept as classification
#                         candidates even without topic signals in their title.
#
# Compiled by the implementing agent (agent-provisional). DBLP prefixes have NOT been
# checked against a live DBLP dump from this environment; verify with T16/T17.
version: venues-v1
venues:
  # IACR and core cryptography venues
  - {key: conf/crypto, name: CRYPTO, cryptographic: true, candidate: true}
  - {key: conf/eurocrypt, name: EUROCRYPT, cryptographic: true, candidate: true}
  - {key: conf/asiacrypt, name: ASIACRYPT, cryptographic: true, candidate: true}
  - {key: conf/tcc, name: Theory of Cryptography Conference, cryptographic: true, candidate: true}
  - {key: conf/pkc, name: Public Key Cryptography, cryptographic: true, candidate: true}
  - {key: journals/joc, name: Journal of Cryptology, cryptographic: true, candidate: true}
  - {key: conf/ches, name: CHES, cryptographic: true, candidate: true}
  - {key: journals/tches, name: IACR Transactions on Cryptographic Hardware and Embedded Systems, cryptographic: true, candidate: true}
  - {key: conf/fse, name: Fast Software Encryption, cryptographic: true, candidate: true}
