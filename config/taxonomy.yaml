    areas: [proof-systems]
  - id: alternative-constructions
    display_name: MPC/VOLE-in-the-head and other constructions
    areas: [proof-systems]
  - id: proving-systems
    display_name: zkVMs, compilers, and proving infrastructure
    areas: [proof-systems]
  - id: verifiable-computation
